<div class="grid grid-cols-12 h-dvh">
    <section class="col-span-12 md:col-span-7 lg:col-span-7 relative hidden md:block lg:block">
        @defer (when isDesktop()) {
            <img src="asset/images/sider-shopping.webp" class="w-full h-full object-fill" alt="Sider Shopping">
            <div class="absolute bottom-0 bg-[#0000006e] py-3 px-4 w-full">
                <p class="text-white">The easiest way to shop online in Central America</p>
            </div>
        }
    </section>
    <section class="col-span-12 md:col-span-5 lg:col-span-5 flex justify-center flex-col">
        <div class="w-full p-4 text-center">
            <h1 class="text-[#c48628] font-bold text-[40px]">ShopHub</h1>
        </div>
        <div class="w-full px-4 background-red">
            <h3 class="text-[24px]">Hello Again!</h3>
            <p class="text-[16px]">Welcome Back</p>
        </div>
        <div class="pt-6 px-4">
            <form novalidate (submit)="onSubmit($event)">
                <div>
                   <app-input 
                        type="email"
                        [formField]="loginForm.email" 
                        label="Email"
                        placeholder="Enter your email"
                    /> 
                </div>
                <div>
                    <app-input 
                        [formField]="loginForm.password" 
                        label="Password"
                        placeholder="Enter your password"
                        type="password"
                    />
                </div>
                <div>
                    <app-button label="Continue" [disabled]="loginForm().invalid()" />
                </div>
            </form>
        </div>
    </section>
</div>
